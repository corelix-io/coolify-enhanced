# overlays.lock — upstream blob SHA manifest for Corelix overlay files.
#
# Format (space-separated):
#   <our-overlay-path>  <upstream-path-in-coolify>  <blob-sha-at-pinned-version>
#
# Pinned to Coolify v4.3.23.
#
# PURPOSE
# -------
# CI reads COOLIFY_VERSION from docker/Dockerfile, fetches upstream files at that tag,
# computes their blob SHAs, and compares against this file.  If any SHA differs the
# overlay is STALE and must be reviewed before the PR can merge.
#
# WORKFLOW
# --------
# When bumping COOLIFY_VERSION:
#   1. Update the version in docker/Dockerfile and .github/workflows/*.yml
#   2. Run: scripts/check-overlay-parity.sh          # shows stale + missing functions
#   3. Update each stale overlay to be compatible with the new upstream version
#   4. Run: scripts/check-overlay-parity.sh --update-lock  # refreshes SHAs below
#   5. Commit Dockerfile + CI files + overlays + this lock in one PR
#
# Never edit SHAs by hand — use --update-lock.
# Add a new row when you add a new overlay file that has an upstream counterpart.

